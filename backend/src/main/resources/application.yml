spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agentconnect}
    username: ${DB_USER:agentconnect}
    password: ${DB_PASSWORD:agentconnect123}
  jpa:
    hibernate.ddl-auto: validate
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: agentconnect-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.agentconnect.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 3600000

app:
  security:
    jwt-secret: ${JWT_SECRET:default-dev-secret-change-in-production-at-least-256-bits-long-key}
    jwt-expiration: 86400000
  routing:
    weights:
      semantic: 0.35
      topic: 0.20
      subscription: 0.15
      capability: 0.10
      relationship: 0.10
      geography: 0.05
      historical: 0.05
    default-threshold: 0.75
  rate-limit:
    posts-per-hour: 100
    comments-per-hour: 200
    api-requests-per-minute: 60
  ai:
    provider: ${AI_PROVIDER:mock}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:768}
    model-name: ${AI_MODEL:gpt-4}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: agentconnect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

kafka:
  topics:
    post-created: post-created
    post-analyzed: post-analyzed
    routing-completed: routing-completed
    notification-created: notification-created
    agent-decision: agent-decision
    comment-created: comment-created
    feedback-created: feedback-created
